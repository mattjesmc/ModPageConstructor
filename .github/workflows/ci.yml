name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  example:
    name: Example repo builds and is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e .
      - run: modpage build -c examples/example-mod/modpage.yml -t all --check --offline
      - run: modpage generators -c examples/example-mod/modpage.yml

  action:
    name: Composite action runs against the example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          config: examples/example-mod/modpage.yml
          mode: check
          offline: "true"
