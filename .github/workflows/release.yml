# On a release tag (v0.4.2), check that the tag matches the package version and
# that the example still builds, then move the series tag (v0.4) to it and
# publish a GitHub release. Mod repos pin the series, so this is what ships a
# patch to them.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The tag must match pyproject.toml and __version__
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pyproject="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          module="$(python -c 'import re; print(re.search(r"__version__ = .(.+?).$", open("src/modpage/__init__.py").read(), re.M).group(1))')"
          if [ "$tag" != "$pyproject" ] || [ "$tag" != "$module" ]; then
            echo "::error::tag v$tag, pyproject $pyproject and __version__ $module disagree"
            exit 1
          fi
          echo "series=v${tag%.*}" >> "$GITHUB_OUTPUT"

      - name: The example must build clean on this release
        run: |
          set -euo pipefail
          python -m pip install --quiet -e .
          modpage build -c examples/example-mod/modpage.yml -t all --check --offline
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::the build changed tracked files"
            exit 1
          fi

      - name: Move the series tag
        env:
          SERIES: ${{ steps.version.outputs.series }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$SERIES" -m "modpage $SERIES series, currently $GITHUB_REF_NAME"
          git push -f origin "refs/tags/$SERIES"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ steps.version.outputs.series }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "modpage $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Series tag $SERIES now points here. Mod repos pinned to @$SERIES pick this up on their next build."
