# modpage.yml -- the single source of truth for this mod's pages.
# Build with:  modpage build          (README.md + dist/modrinth.md + dist/curseforge.md)
# List the shared skeleton with:  modpage sections

# The config series this file is written for. Patch releases (0.4.1, 0.4.2, ...)
# never change what a key means; only a new series (0.5) may. Keep it quoted.
modpage: "{series}"

name: My Mod
slug: my-mod                      # Modrinth/CurseForge slug; used by the download badge
tagline: One line that sells the mod.
authors: [Your Name]
license: MIT

assets:
  dir: assets
  banner_dir: banners
  # Modrinth and CurseForge cannot read repo-relative paths, so images need an
  # absolute prefix. Point this at the raw host for this repo:
  base_url: https://raw.githubusercontent.com/USER/REPO/main/

links:
  github: https://github.com/USER/REPO
  # modrinth: https://modrinth.com/mod/my-mod
  # curseforge: https://www.curseforge.com/minecraft/mc-mods/my-mod
  # issues: https://github.com/USER/REPO/issues
  # discord: https://discord.gg/XXXX
  # wiki: https://github.com/USER/REPO/wiki

minecraft:
  versions: ["1.21.1"]
  loaders: [Fabric]
  environment: Client & Server     # free text: Client, Server, or both

badges:
  style: for-the-badge
  color: 5b21b6
  # show: [modrinth, curseforge, github, loaders, versions, license, discord]
  # extra:
  #   - alt: Ko-fi
  #     image: https://img.shields.io/badge/Ko--fi-Support-FF5E5B?style=for-the-badge
  #     url: https://ko-fi.com/you

header:
  # banner: banners/header.png     # auto-detected if the file exists
  # width: 720
  # section_banner_width: 520
  # heading_with_banner: false     # also print a text heading under each banner

# A contents list between the header and the first section. Leave the whole
# block out for no list at all.
# toc:
#   title: Contents      # heading above the list; false for none
#   style: list          # list (bulleted) | inline (one centred row of links)
#   numbered: false
#   skip: [license]      # section ids to leave out
#   min_sections: 2      # skip the list when the page has fewer sections
#   targets: [readme, modrinth]   # default: every target
#   banner: banners/contents.png  # auto-detected if the file exists

# Element generators build page content from the repo instead of from this
# file, so a release or a new screenshot updates the pages on its own.
# `modpage generators` lists what is available and previews what yours produce.
# generators:
#   releases:                      # every tagged release, with its commits
#     use: git.changelog           # or changelog.file, to read CHANGELOG.md
#     match: "v*"
#     limit: 5
#   screenshots:                   # every image in assets/gallery/
#     use: files.glob
#     pattern: "gallery/*.png"
#   support:                       # the `minecraft:` block above, as rows
#     use: config.versions
#
# Reference one anywhere a list is expected with `{from: <name>}`. In a list it
# splices, so generated and hand-written entries can sit side by side:
#
#   sections:
#     gallery:
#       images: {from: screenshots}
#     features:
#       items:
#         - title: Written by hand
#         - from: releases          # ...and the rest generated
#           limit: 3
#
# Every reference can filter and reshape what it gets, with `where`, `when`,
# `sort`, `limit`, `offset`, `map`, `fields`, `unique` and `group_by`.
#
# Write your own by dropping a module in .modpage/generators/:
#
#   from modpage.generators import generator
#
#   @generator("mymod.showcase")
#   def showcase(ctx):
#       return [{"title": p.stem, "image": f"showcase/{p.name}"}
#               for p in ctx.glob("showcase/*.png")]

sections:
  about: |
    What the mod does, in a paragraph or two. Markdown works here.

  features:
    items:
      - title: First feature
        description: What it does and why it is nice.
      - Second feature, as a bare line

  # gallery:
  #   images:
  #     - src: gallery/overview.png
  #       caption: The thing, in game

  # Recipe cards are extracted from this repo's data files and rendered to
  # images in assets/recipes/. Delete this block if the mod has no recipes.
  recipes:
    columns: 3           # cards per row
    scale: 3             # 3 = 48px items
    collapsed: true      # fold behind a <details> (GitHub + Modrinth)
    # summary: "Show all recipes"
    # paths: [src/main/resources/data]   # where to look for data/<ns>/recipe/*.json
    # include: ["my-mod:*"]              # glob filters on recipe id
    # exclude: ["*_from_*"]
    # cycle_ms: 1000     # GIF frame time for tag ingredients
    # max_frames: 8      # cap on cycled alternatives per slot
    # vanilla: auto      # auto | off | path/to/extracted/assets
    # out: recipes       # subfolder under assets/
    # labels:            # override a card's caption (default: its file name)
    #   "my-mod:tricky_recipe": "The Good Name"
    # icons:             # items with no flat texture (shields, banners, 3D blocks)
    #   minecraft:shield: icons/shield.png     # relative to assets.dir
    # custom_types:      # modded recipe types the tool cannot know about
    #   "my-mod:my_smithing_type":
    #     layout: smithing     # shaped | shapeless | single | smithing
    #     result: base         # template | base | addition | an explicit item id

  # Shared by every mod page, rendered even when empty.
  dependencies:
    required:
      - name: Fabric API
        url: https://modrinth.com/mod/fabric-api
        version: ">=0.100.0"
        note: Required on both sides
    optional: []
    bundled: []
    # empty_text: "**None.** This mod is standalone."

  # Shared by every mod page, rendered even when empty.
  incompatibilities:
    known: []
    #  - name: Some Mod
    #    url: https://modrinth.com/mod/some-mod
    #    reason: Both rewrite the same chunk section
    #    workaround: Disable X in its config
    # empty_text: "**None known.** No conflicts have been reported."

  installation: |
    1. Install [Fabric Loader](https://fabricmc.net/use/).
    2. Drop this mod and its dependencies into `mods/`.
    3. Launch the game.

  # configuration: |
  #   The config lives at `config/my-mod.json`.

  # changelog:
  #   elements: {from: releases}   # needs a `releases:` generator above
  #   collapsed: true              # fold it away behind a summary line

  # faq:
  #   items:
  #     - q: Does it work on servers?
  #       a: Yes, install it on both sides.

  # credits: |
  #   Thanks to ...

  # license: rendered from the top-level `license:` unless you write a body here.

# custom_sections:
#   - id: performance
#     title: Performance
#     after: features          # where it slots into the shared order
#     body: |
#       Measured on ...
#   - id: support
#     title: Supported versions
#     after: about
#     layout: table            # list | cards | table | gallery | slider |
#                              # changelog | definition
#     columns: [{field: version, title: Minecraft}, {field: description, title: Loaders}]
#     elements: {from: support}

# Per-target output paths (defaults shown).
# outputs:
#   readme: README.md
#   modrinth: dist/modrinth.md
#   curseforge: dist/curseforge.md        # paste into CurseForge's Markdown editor
#   curseforge-html: dist/curseforge.html # opt-in: modpage build -t curseforge-html

# footer: "Made with care. Issues and PRs welcome."
