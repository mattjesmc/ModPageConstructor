[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modpage"
version = "0.2.0"
description = "Generate mod pages (GitHub README, Modrinth, CurseForge) from one config + template + assets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "Markdown>=3.5",
    "Pillow>=10.0",
]

[project.scripts]
modpage = "modpage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modpage"]
