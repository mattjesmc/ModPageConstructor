name: modpage
description: >-
  Build a mod's GitHub README, Modrinth and CurseForge pages from its modpage.yml,
  and (by default) commit whatever changed.
author: Matthijs

branding:
  icon: book-open
  color: purple

inputs:
  config:
    description: Path to modpage.yml, relative to the repository root.
    default: modpage.yml
  targets:
    description: >-
      Space-separated targets to render (readme modrinth curseforge curseforge-html,
      or all). Empty renders the default set.
    default: ""
  mode:
    description: >-
      What to do with the result. `commit` writes the files and pushes a commit when
      anything changed; `check` fails the job if any generated file is out of date;
      `build` writes the files and leaves committing to a later step.
    default: commit
  commit-message:
    description: Commit message used in `commit` mode.
    default: "docs: regenerate mod pages"
  offline:
    description: Never fetch vanilla textures or tags; rely on `.modpage/cache/` only.
    default: "false"
  python-version:
    description: Python version to run the generator with.
    default: "3.12"

outputs:
  changed:
    description: "`true` when a generated file differed from the checked-in one."
    value: ${{ steps.build.outputs.changed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install modpage (the version this action is pinned to)
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Locate the mod repo
      id: locate
      shell: bash
      env:
        MODPAGE_CONFIG: ${{ inputs.config }}
      run: |
        [ -f "$MODPAGE_CONFIG" ] || { echo "::error::no config at '$MODPAGE_CONFIG'"; exit 2; }
        echo "dir=$(dirname "$MODPAGE_CONFIG")" >> "$GITHUB_OUTPUT"

    - name: Restore the vanilla texture cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.locate.outputs.dir }}/.modpage/cache
        key: modpage-cache-${{ hashFiles('**/modpage.yml', '**/data/**/recipe*/*.json') }}
        restore-keys: modpage-cache-

    - name: Build the pages
      id: build
      shell: bash
      env:
        MODPAGE_CONFIG: ${{ inputs.config }}
        MODPAGE_TARGETS: ${{ inputs.targets }}
        MODPAGE_MODE: ${{ inputs.mode }}
        MODPAGE_OFFLINE: ${{ inputs.offline }}
      run: |
        set -euo pipefail
        args=(build -c "$MODPAGE_CONFIG")
        for target in $MODPAGE_TARGETS; do args+=(-t "$target"); done
        [ "$MODPAGE_OFFLINE" = "true" ] && args+=(--offline)
        [ "$MODPAGE_MODE" = "check" ] && args+=(--check)

        case "$MODPAGE_MODE" in
          commit|check|build) ;;
          *) echo "::error::mode must be commit, check or build (got '$MODPAGE_MODE')"; exit 2 ;;
        esac

        modpage "${args[@]}"

        if [ "$MODPAGE_MODE" = "check" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        elif git -C "$(dirname "$MODPAGE_CONFIG")" status --porcelain -- . ':!.modpage/cache' | grep -q .; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push
      if: inputs.mode == 'commit' && steps.build.outputs.changed == 'true'
      shell: bash
      env:
        MODPAGE_CONFIG: ${{ inputs.config }}
        MODPAGE_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail
        cd "$(dirname "$MODPAGE_CONFIG")"
        if ! branch="$(git symbolic-ref --short -q HEAD)"; then
          echo "::error::HEAD is detached, so there is no branch to push to." \
               "Check out the default branch first: actions/checkout with" \
               "'ref: \${{ github.event.repository.default_branch }}'."
          exit 1
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A -- . ':!.modpage/cache'
        git commit -m "$MODPAGE_MESSAGE"
        git push origin "HEAD:$branch"
