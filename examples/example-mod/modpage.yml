name: Lantern Lights
slug: lantern-lights
tagline: Hand-placed lanterns that actually light the world.
authors: [Matthijs]
license: MIT

assets:
  dir: assets
  base_url: https://raw.githubusercontent.com/Matthijs/lantern-lights/main/

links:
  github: https://github.com/Matthijs/lantern-lights
  modrinth: https://modrinth.com/mod/lantern-lights
  curseforge: https://www.curseforge.com/minecraft/mc-mods/lantern-lights
  issues: https://github.com/Matthijs/lantern-lights/issues

minecraft:
  versions: ["1.21.1", "1.20.1"]
  loaders: [Fabric, NeoForge]
  environment: Client & Server

badges:
  style: for-the-badge
  color: 5b21b6

header:
  width: 720
  section_banner_width: 480

toc:
  title: Contents
  style: list          # or `inline` for one centred row of links
  skip: [license]

# Element generators: content pulled from the repo instead of typed out again.
# `modpage generators` shows what each one currently produces.
generators:
  # Every release the hand-written CHANGELOG.md describes.
  releases:
    use: changelog.file
    limit: 3

  # Every screenshot in assets/gallery/, captioned from its file name.
  screenshots:
    use: files.glob
    pattern: "gallery/*.png"
    captions:                      # file stem -> caption; the rest are prettified
      overview: A lit mineshaft, no torches placed

  # The `minecraft:` block above, crossed into one row per version.
  support:
    use: config.versions

sections:
  about: |
    Lantern Lights replaces the vanilla lantern with a dynamic light source that
    follows the block it is attached to, so corridors, mineshafts and boats stay
    lit without a single command block.

    It is a drop-in change: no new items, no world data, nothing to migrate.

  features:
    items:
      - title: Dynamic lighting
        description: Lanterns emit light along the path they are carried.
      - title: Zero config required
        description: Sensible defaults out of the box; every value is tunable.
      - Server-side friendly, with client-only rendering

  gallery:
    images: {from: screenshots}

  recipes:
    columns: 3
    scale: 3
    summary: "Show all recipes"
    body: |
      Every recipe below is generated straight from the mod's data files.

  dependencies:
    required:
      - name: Fabric API
        url: https://modrinth.com/mod/fabric-api
        version: ">=0.100.0"
        note: Fabric builds only
    optional:
      - name: Mod Menu
        url: https://modrinth.com/mod/modmenu
        note: In-game config screen

  incompatibilities:
    known:
      - name: Shimmer
        url: https://modrinth.com/mod/shimmer
        reason: Both patch the light engine
        workaround: Disable Shimmer's dynamic lights

  installation: |
    1. Install [Fabric Loader](https://fabricmc.net/use/) or NeoForge.
    2. Drop `lantern-lights.jar` (and Fabric API on Fabric) into `mods/`.
    3. Launch the game.

  configuration: |
    The config lives at `config/lantern-lights.json`:

    | Key | Default | Meaning |
    | --- | --- | --- |
    | `radius` | `12` | Light radius in blocks |
    | `smooth` | `true` | Fade light in and out |

  changelog:
    elements: {from: releases}
    collapsed: true
    summary: "What changed in the last three releases"
    body: |
      Generated from `CHANGELOG.md` at build time -- write the entry once, and
      all three pages carry it.

  faq:
    items:
      - q: Does it work on a server?
        a: Yes. Install it on both sides for the full effect.
      - q: Does it break shaders?
        a: No, it uses the vanilla light engine.

  credits: |
    Textures by **@someone**. Thanks to the Fabric community for the light engine notes.

custom_sections:
  - id: support
    title: Supported versions
    after: about
    layout: table
    columns:
      - {field: version, title: Minecraft}
      - {field: description, title: Loaders}
    elements: {from: support}

footer: "Issues and pull requests are welcome."
